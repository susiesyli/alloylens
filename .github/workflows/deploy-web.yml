# Publishes web/ to the gh-pages branch of susiesyli/alloylens-web.
# GitHub Pages builds the URL from the repo name, so the site has to be served
# from that repo to stay at susiesyli.com/alloylens-web/.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage site files
        run: |
          mkdir _site
          cp web/index.html web/tutorial.html web/ui.css _site/
          cp -R web/webapp _site/webapp
          touch _site/.nojekyll

      - name: Publish to alloylens-web
        env:
          DEPLOY_KEY: ${{ secrets.ALLOYLENS_WEB_DEPLOY_KEY }}
        run: |
          key_file="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy susiesyli/alloylens@$GITHUB_SHA"
          git push --force git@github.com:susiesyli/alloylens-web.git gh-pages
