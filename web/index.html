<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AlloyLens</title>
    <link rel="stylesheet" href="webapp/css/mywidget.css" />
    <link rel="stylesheet" href="ui.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/intro.js/minified/introjs.min.css"
    />
  </head>
  <body>
    <nav id="top-nav" style="margin: 12px 0">
      <a href="tutorial.html" class="btn btn-ghost" id="tutorial-link"
        >Walkthrough Tutorial</a
      >
    </nav>
    <h1>
      AlloyLens: A Visual Analytics Tool for High-throughput Alloy Screening and
      Inverse Design
    </h1>
    <div id="app">
      <aside id="controls">
        <h2>Select features</h2>

        <div class="axis-panels">
          <!-- X axis (columns) -->
          <section class="axis-panel" id="panel-x">
            <h3>X-axis (columns)</h3>
            <div class="group-row">
              <label
                ><input
                  type="checkbox"
                  data-group="inputs"
                  class="group-x"
                />Inputs</label
              >
              <label
                ><input
                  type="checkbox"
                  data-group="elements"
                  class="group-x"
                />Elements</label
              >
              <label
                ><input
                  type="checkbox"
                  data-group="micro"
                  class="group-x"
                />Microstructures</label
              >
              <label
                ><input
                  type="checkbox"
                  data-group="props"
                  class="group-x"
                />Properties</label
              >
            </div>
            <div id="list-x" class="overflow" style="height: 70px"></div>
            <div class="row small">
              <button id="x-select-all" type="button" class="btn btn-ghost">
                Select all
              </button>
              <button id="x-clear" type="button" class="btn btn-ghost">
                Clear
              </button>
            </div>
          </section>

          <!-- Y axis (rows) -->
          <section class="axis-panel" id="panel-y">
            <h3>Y-axis (rows)</h3>
            <div class="group-row">
              <label
                ><input
                  type="checkbox"
                  data-group="inputs"
                  class="group-y"
                />Inputs</label
              >
              <label
                ><input
                  type="checkbox"
                  data-group="elements"
                  class="group-y"
                />Elements</label
              >
              <label
                ><input
                  type="checkbox"
                  data-group="micro"
                  class="group-y"
                />Microstructures</label
              >
              <label
                ><input
                  type="checkbox"
                  data-group="props"
                  class="group-y"
                />Properties</label
              >
            </div>
            <div id="list-y" class="overflow" style="height: 120px"></div>
            <div class="row small">
              <button id="y-select-all" type="button" class="btn btn-ghost">
                Select all
              </button>
              <button id="y-clear" type="button" class="btn btn-ghost">
                Clear
              </button>
            </div>
          </section>
        </div>

        <div class="axis-panel" style="padding-top: 8px">
          <div class="row">
            <button id="export" class="btn">Export selected</button>
            <span id="selected-count">[0 selected]</span>
          </div>
        </div>

        <div id="toolbar">
          <span>Surrogate model</span>
          <button id="toggle-surrogate" class="btn btn-primary">
            Show surrogate curves
          </button>
        </div>

        <h2>Recommendation Range</h2>
        <section class="axis-panel">
          <div class="row" style="align-items: center; gap: 8px">
            <label for="knn-delta">Distance threshold:</label>
            <input
              type="range"
              id="knn-delta"
              min="0.01"
              max="0.20"
              step="0.01"
              value="0.02"
            />
            <span id="knn-delta-value">0.02</span>
          </div>
        </section>
      </aside>

      <main id="main">
        <div id="plot-info">No plot yet — choose features and click Apply</div>
        <div id="splom"></div>
      </main>
    </div>

    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    <script src="webapp/tutorial.js"></script>
    <script type="module" src="webapp/app.js"></script>
  </body>
</html>
