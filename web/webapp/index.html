<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AlloyLens — UI port</title>
    <link rel="stylesheet" href="css/mywidget.css" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100dvh;
      }
      aside#controls {
        padding: 16px;
        border-right: 1px solid #eee;
      }
      #main {
        padding: 12px;
        overflow: auto;
      }
      #plot-info {
        color: #777;
        margin-bottom: 8px;
      }
      .overflow {
        overflow: auto;
      }
      #checkboxes label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="controls">
        <h2>Select features to plot</h2>

        <div class="axis-panels">
          <!-- X axis (columns) -->
          <section class="axis-panel" id="panel-x">
            <h3>X-axis (columns)</h3>
            <div class="group-row">
              <label
                ><input type="checkbox" data-group="inputs" class="group-x" />
                Inputs</label
              >
              <label
                ><input type="checkbox" data-group="elements" class="group-x" />
                Elements</label
              >
              <label
                ><input type="checkbox" data-group="micro" class="group-x" />
                Microstructures</label
              >
              <label
                ><input type="checkbox" data-group="props" class="group-x" />
                Properties</label
              >
            </div>
            <div id="list-x" class="overflow" style="height: 160px"></div>
            <div class="row small">
              <button id="x-select-all" type="button">Select shown</button>
              <button id="x-clear" type="button">Clear</button>
            </div>
          </section>

          <!-- Y axis (rows) -->
          <section class="axis-panel" id="panel-y">
            <h3>Y-axis (rows)</h3>
            <div class="group-row">
              <label
                ><input type="checkbox" data-group="inputs" class="group-y" />
                Inputs</label
              >
              <label
                ><input type="checkbox" data-group="elements" class="group-y" />
                Elements</label
              >
              <label
                ><input type="checkbox" data-group="micro" class="group-y" />
                Microstructures</label
              >
              <label
                ><input type="checkbox" data-group="props" class="group-y" />
                Properties</label
              >
            </div>
            <div id="list-y" class="overflow" style="height: 160px"></div>
            <div class="row small">
              <button id="y-select-all" type="button">Select shown</button>
              <button id="y-clear" type="button">Clear</button>
            </div>
          </section>
        </div>

        <div class="row" style="margin-top: 8px">
          <button id="apply">Apply</button>
        </div>
        <div class="row" style="margin-top: 8px">
          <button id="export">Export selected rows</button>
          <span id="selected-count">[0 selected]</span>
        </div>
      </aside>

      <main id="main">
        <div id="plot-info">No plot yet — choose features and click Apply</div>
        <div id="splom"></div>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
