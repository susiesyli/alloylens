<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AlloyLens — UI port</title>
    <link rel="stylesheet" href="css/mywidget.css" />
  </head>
  <body>
    <div id="app">
      <aside id="controls">
        <h2>Select features to plot</h2>
        <div id="checkboxes" class="overflow" style="height: 300px"></div>
        <button id="apply">Apply</button>
        <div style="margin-top: 8px">
          <button id="export">Export selected rows</button>
          <span id="selected-count">[0 selected]</span>
        </div>
      </aside>

      <main id="main">
        <div id="plot-info">No plot yet — choose features and click Apply</div>
        <div id="splom"></div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
